# Comprehensive Security Scanning Pipeline

This project includes a complete security scanning pipeline using CircleCI.

## Features

- **SAST (Static Application Security Testing)**
  - Semgrep (multi-language)
  - ESLint with security rules
  - Bandit (Python)
  - Gosec (Go)

- **SCA (Software Composition Analysis)**
  - OWASP Dependency Check
  - npm audit / pip-audit
  - Software Bill of Materials (SBOM) generation

- **Code Quality**
  - SonarCloud integration
  - Quality gate enforcement

- **API Security Testing**
  - OWASP ZAP baseline scans
  - Active vulnerability scanning

- **SSL/TLS Security**
  - SSLScan
  - SSLyze
  - Certificate validation

## Setup

1. **Copy the configuration files** to your project
2. **Set environment variables** in CircleCI:
   ```bash
   SONAR_ORG=your-org
   SONAR_PROJECT_KEY=your-project-key
   SONAR_TOKEN=your-token
   API_BASE_URL=https://your-api.com  # optional
   APP_DOMAIN=your-app.com           # optional
